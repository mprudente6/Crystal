<div class="carousel-wrapper">
  <div
    id="crystalCarousel"
    class="carousel slide"
    data-bs-ride="carousel"
  >
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img
          src="/images/gallery/IMG_11.jpeg"
          class="d-block w-100"
          alt="Crystal 1"
        />
      </div>

      <div class="carousel-item">
        <img
          src="/images/gallery/IMG_44.jpeg"
          class="d-block w-100"
          alt="Crystal 2"
        />
      </div>

      <div class="carousel-item">
        <img
          src="/images/gallery/IMG_38.jpeg"
          class="d-block w-100"
          alt="Crystal 3"
        />
      </div>

    </div>

    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#crystalCarousel"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#crystalCarousel"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</div>
